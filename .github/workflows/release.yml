name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 前のタグ参照のため全履歴が必要

      - name: Build release notes from commit log
        id: notes
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          PREV_TAG=$(git tag --sort=-v:refname | grep -v "^${TAG}$" | head -n1 || true)
          if [ -z "$PREV_TAG" ]; then
            RANGE="HEAD"
            HEADER="## Changes"
          else
            RANGE="${PREV_TAG}..HEAD"
            HEADER="## Changes since ${PREV_TAG}"
          fi
          {
            echo "body<<NOTES_EOF"
            echo "$HEADER"
            echo ""
            git log --pretty=format:"- %s (%h)" "$RANGE"
            echo ""
            echo ""
            if [ -n "$PREV_TAG" ]; then
              echo "**Full diff**: https://github.com/${REPO}/compare/${PREV_TAG}...${TAG}"
            fi
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "askmd ${{ github.ref_name }}"
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false

  verify-updater-json:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Ensure latest.json is attached to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name' > /tmp/assets.txt
          if ! grep -q '^latest.json$' /tmp/assets.txt; then
            echo "latest.json was not produced by tauri-action; check signing keys." >&2
            cat /tmp/assets.txt >&2
            exit 1
          fi
