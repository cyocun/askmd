<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>askmd</title>
  <!-- hljs テーマ CSS (テーマ切替で disabled トグル) -->
  <link rel="stylesheet" href="/hljs-github.min.css" id="hljs-theme-light">
  <link rel="stylesheet" href="/github-dark-dimmed.min.css" id="hljs-theme-dark" disabled>
  <link rel="stylesheet" href="/hljs-solarized-light.min.css" id="hljs-theme-solarized-light" disabled>
  <link rel="stylesheet" href="/hljs-solarized-dark.min.css" id="hljs-theme-solarized-dark" disabled>
</head>
<body>
  <!-- タイトルバー (macOS traffic light の領域、全幅ドラッグ可能) -->
  <div id="titleBar" data-tauri-drag-region>
    <div id="toolbar">
      <button id="tbSidebar" class="tb-btn" title="サイドバー (⌘B)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/></svg>
      </button>
      <button id="tbSearch" class="tb-btn" title="すべてのメモから探す (⌘F)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10" r="7"/><path d="M21 21l-6-6"/></svg>
      </button>
      <button id="tbPalette" class="tb-btn" title="ファイルを探す (⌘P)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6l6 6"/></svg>
      </button>
      <button id="tbRecent" class="tb-btn" title="最近更新したメモ">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      </button>
      <button id="tbChanges" class="tb-btn" title="変更のあるファイル">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M8 11l4 4l4-4"/><path d="M8 21h8"/></svg>
      </button>
    </div>
  </div>

  <!-- HTML タブバー (Safari 風、タブ 2 つ以上で表示) -->
  <div id="tabBar" data-tauri-drag-region></div>

  <!-- 左ペイン: ツリー -->
  <aside id="leftPane">
    <div id="searchBar">
      <input id="filterInput" type="text" placeholder="@ でファイル絞り込み" spellcheck="false" autocomplete="off">
    </div>
    <div id="rootLabel"></div>
    <div id="treeContainer" tabindex="0"></div>
    <div id="leftFooter">
      <div id="providerSelector">
        <button id="providerBtn" title="AI を切り替え">Claude <span class="provider-caret">▾</span></button>
        <div id="providerMenu" hidden></div>
      </div>
      <button id="langBtn" class="btn-ghost" title="Language"></button>
      <div id="themeSelector">
        <button id="themeBtn" class="btn-ghost" title="テーマを切り替え">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="M4.93 4.93l1.41 1.41"/><path d="M17.66 17.66l1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="M6.34 17.66l-1.41 1.41"/><path d="M19.07 4.93l-1.41 1.41"/></svg>
        </button>
        <div id="themeMenu" hidden></div>
      </div>
    </div>
  </aside>

  <!-- 右ペイン: レンダリング結果 -->
  <section id="rightPane">
    <header id="docHeader"></header>
    <main id="docContent" tabindex="0">
      <div id="emptyState">
        <button id="openBtnLarge" class="btn-primary btn-large">フォルダを開く…</button>
        <p class="empty-hint">ここにドロップ <span class="empty-sep">/</span> <kbd>⌘</kbd><kbd>O</kbd></p>
      </div>
    </main>
  </section>

  <!-- Cmd+P クイックスイッチャー -->
  <div id="paletteOverlay" hidden>
    <div id="palette">
      <input id="paletteInput" type="text" placeholder="ファイル名で探す…" spellcheck="false">
      <div id="paletteList"></div>
    </div>
  </div>

  <!-- Cmd+F 全文横断検索 -->
  <div id="searchOverlay" hidden>
    <div id="searchBox">
      <input id="searchInput" type="text" placeholder="すべてのメモから探す" spellcheck="false" autocomplete="off">
      <div id="searchStatus"></div>
      <div id="searchResults"></div>
    </div>
  </div>

  <div id="toast" hidden></div>

  <!-- ドラッグ中のフルスクリーンオーバーレイ -->
  <div id="dropOverlay" hidden>
    <div id="dropOverlayInner">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 4h4l3 3h7a2 2 0 0 1 2 2v8a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2v-11a2 2 0 0 1 2 -2"/>
      </svg>
      <p>ここにフォルダをドロップ</p>
    </div>
  </div>

  <script type="module" src="/ts/app.ts"></script>
</body>
</html>
