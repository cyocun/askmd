<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>askmd</title>
  <script src="vendor/markdown-it.min.js"></script>
  <script src="vendor/markdown-it-footnote.min.js"></script>
  <script src="vendor/purify.min.js"></script>
  <script src="vendor/mermaid.min.js"></script>
  <script src="vendor/katex.min.js"></script>
  <link rel="stylesheet" href="vendor/katex.min.css">
  <link rel="stylesheet" href="vendor/hljs-github.min.css" id="hljs-theme-light">
  <link rel="stylesheet" href="vendor/github-dark-dimmed.min.css" id="hljs-theme-dark" disabled>
  <link rel="stylesheet" href="vendor/hljs-solarized-light.min.css" id="hljs-theme-solarized-light" disabled>
  <link rel="stylesheet" href="vendor/hljs-solarized-dark.min.css" id="hljs-theme-solarized-dark" disabled>
  <script src="vendor/highlight.min.js"></script>
  <script src="vendor/hljs-bash.min.js"></script>
  <script src="vendor/hljs-javascript.min.js"></script>
  <script src="vendor/hljs-typescript.min.js"></script>
  <script src="vendor/hljs-python.min.js"></script>
  <script src="vendor/hljs-json.min.js"></script>
  <script src="vendor/hljs-yaml.min.js"></script>
  <script src="vendor/hljs-css.min.js"></script>
  <script src="vendor/hljs-xml.min.js"></script>
  <script src="vendor/hljs-diff.min.js"></script>
  <script src="vendor/hljs-sql.min.js"></script>
  <link rel="stylesheet" href="styles/app.css">
</head>
<body>
  <!-- タイトルバー (macOS traffic light の領域、全幅ドラッグ可能) -->
  <div id="titleBar" data-tauri-drag-region>
    <div id="toolbar">
      <button id="tbSidebar" class="tb-btn" title="サイドバー (⌘B)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/></svg>
      </button>
      <button id="tbSearch" class="tb-btn" title="全文検索 (⌘F)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10" r="7"/><path d="M21 21l-6-6"/></svg>
      </button>
      <button id="tbPalette" class="tb-btn" title="クイックスイッチ (⌘P)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6l6 6"/></svg>
      </button>
    </div>
  </div>

  <!-- 左ペイン: ツリー -->
  <aside id="leftPane">
    <div id="searchBar">
      <input id="filterInput" type="text" placeholder="@ でファイル絞り込み" spellcheck="false" autocomplete="off">
    </div>
    <div id="rootLabel"></div>
    <div id="treeContainer" tabindex="0"></div>
    <div id="leftFooter">
      <div id="providerSelector">
        <button id="providerBtn" title="AI プロバイダー切替">Claude <span class="provider-caret">▾</span></button>
        <div id="providerMenu" hidden></div>
      </div>
      <button id="langBtn" class="btn-ghost" title="Language"></button>
      <div id="themeSelector">
        <button id="themeBtn" class="btn-ghost" title="テーマ切替">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="M4.93 4.93l1.41 1.41"/><path d="M17.66 17.66l1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="M6.34 17.66l-1.41 1.41"/><path d="M19.07 4.93l-1.41 1.41"/></svg>
        </button>
        <div id="themeMenu" hidden></div>
      </div>
    </div>
  </aside>

  <!-- 右ペイン: レンダリング結果 -->
  <section id="rightPane">
    <header id="docHeader"></header>
    <main id="docContent" tabindex="0">
      <div id="emptyState">
        <button id="openBtnLarge" class="btn-primary btn-large">ディレクトリを開く…</button>
        <p class="empty-hint">Drop <span class="empty-sep">/</span> <kbd>⌘</kbd><kbd>O</kbd></p>
      </div>
    </main>
  </section>

  <!-- Cmd+P クイックスイッチャー -->
  <div id="paletteOverlay" hidden>
    <div id="palette">
      <input id="paletteInput" type="text" placeholder="ファイル名で検索…" spellcheck="false">
      <div id="paletteList"></div>
    </div>
  </div>

  <!-- Cmd+F 全文横断検索 -->
  <div id="searchOverlay" hidden>
    <div id="searchBox">
      <input id="searchInput" type="text" placeholder="全文検索: 読み込んでいる .md を横断" spellcheck="false" autocomplete="off">
      <div id="searchStatus"></div>
      <div id="searchResults"></div>
    </div>
  </div>

  <div id="toast" hidden></div>

  <!-- ドラッグ中のフルスクリーンオーバーレイ -->
  <div id="dropOverlay" hidden>
    <div id="dropOverlayInner">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 4h4l3 3h7a2 2 0 0 1 2 2v8a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2v-11a2 2 0 0 1 2 -2"/>
      </svg>
      <p>ここにフォルダをドロップ</p>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
